name: frontend-ci

# **프론트 PR 의 검사 결과를 PR 체크로 보여 준다** (이슈 #497).
#
# `verify` 는 Jenkins 프론트 PR 빌드(`Jenkinsfile.frontend-common.groovy` 「프론트 빌드」,
# `RUN_TESTS`)와 **같은 명령**을 돈다. FE 에 새 규칙을 더하지 않는다. 다만 Jenkins PR 빌드는
# `frontend-web` 라벨이 붙어야 생기고(`Github label filter`), 결과가 Jenkins 화면에 있다.
# 이쪽은 라벨과 무관하게 돌고 결과를 PR 에서 바로 보여 준다.
#
# `e2e` 는 백엔드 없이 도는 Playwright 슈트(커뮤니티·인증·레이아웃·홈 불변식·상권분석 시트)를 프로덕션 빌드로
# 돈다(#477, #632). Jenkins 빌드 에이전트에는 Chromium 과 시스템 의존성이 없어서, Jenkins 대신
# 이 워크플로에 붙였다. Actions 러너는 `playwright install --with-deps` 가 바로 된다(`frontend/docs/runbook/qa.md` §2).
#
# **`verify` · `e2e` 는 develop 의 필수 체크(required status check)다.** 그래서 두 체크는 **모든 PR 에서
# 반드시 생겨야** 한다. 체크가 아예 안 생기면 PR 은 「Expected — Waiting for status」로 영원히 막힌다.
# - `pull_request` 에 `paths` 를 두지 않는다. 워크플로 수준 `paths` 로 거르면 BE 전용·저장소 설정 PR 에서
#   워크플로가 돌지 않아 체크가 생기지 않는다.
# - 대신 `changes` 잡이 프론트 변경을 가르고, 변경이 없으면(`kind=none`) 두 잡을 **잡 수준 `if` 로 건너뛴다.**
#   건너뛴 잡은 `skipped` 로 보고되고 필수 체크는 이것을 통과로 친다.
# - 스텝 수준 `if` 로 걸러도 체크는 생긴다. 잡 수준으로 거르는 이유는 FE 와 무관한 PR 에서 러너를 잡고
#   의존성을 설치하는 시간을 쓰지 않기 위해서다.

on:
  # 기본 `types`(opened · synchronize · reopened)로 둔다. 새 커밋마다 새 실행이 head SHA 에 체크를 남긴다.
  # 브랜치를 거르지 않는다. 스택 PR(다른 기능 브랜치 대상)도 검사한다.
  pull_request:
  # **develop push 에서도 돈다 — 캐시 때문이다** (`backend-ci.yml` 의 같은 블록).
  # 기본 브랜치 스코프 캐시가 있어야 PR 마다 pnpm store 를 처음부터 받지 않는다.
  # 겸사겸사 머지된 develop 자체를 검사한다.
  # push 는 필수 체크와 무관하다(필수 체크는 PR head 커밋에서 센다). 그래서 이쪽은 `paths` 로 거른다 —
  # 프론트와 무관한 머지마다 빌드·e2e 를 돌 이유가 없다.
  push:
    branches:
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'scripts/classify-frontend-changes.sh'

# 같은 PR 에 새 커밋이 올라오면 이전 실행을 버린다. 취소된 실행의 체크는 **옛 head 커밋**에 남고,
# 필수 체크는 PR 의 지금 head 커밋에서만 세므로 머지를 막지 않는다. 같은 커밋을 다시 돌린 경우
# (reopen·재실행)에도 같은 이름의 가장 최근 체크가 이긴다.
#
# develop push 는 취소하지 않는다. 앞 실행이 취소되면 그 커밋은 검사되지 않고,
# base 스코프 캐시도 저장되지 않는다(캐시는 성공한 잡의 post 단계에서만 저장된다).
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 무엇이 바뀌었는지 먼저 가른다.
  # - `code` — `verify` 전부 + `e2e`
  # - `docs` — `frontend/` 에서 문서만 바뀌었다. `verify` 는 `format:check` 만, `e2e` 는 skipped
  # - `none` — 프론트와 무관하다(BE 전용·다른 워크플로·루트 문서). 두 잡 모두 skipped
  #
  # **판정 기준은 `scripts/classify-frontend-changes.sh` 한 곳에 있다.**
  # develop push 는 늘 `code` 다 — base 스코프 캐시를 만들고 머지된 develop 을 검사하는
  # 목적이라 건너뛰면 안 된다. 판정이 실패하면 `code` 로 본다. 모르는 것을 "안 바뀌었다" 로 읽지 않는다.
  #
  # **이 잡 자체가 실패해도 아래 두 잡은 건너뛰지 않고 전부 돈다.** `needs` 가 실패하면 기본으로 뒤
  # 잡이 skipped 가 되는데, skipped 는 필수 체크에서 통과다. 판정 실패가 곧 검사 생략이 되면 안 된다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@v4

      # `shell: bash` 를 명시해야 `-o pipefail` 이 켜진다. 기본 셸(`bash -e`)은 파이프 앞쪽
      # `git diff` 가 실패해도 classify 가 빈 입력으로 `none` 을 내고 `|| kind=code` 를 타지 않는다.
      - id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          kind=code
          if [ "$EVENT_NAME" = "pull_request" ] && git fetch --quiet --depth=1 origin "$BASE_SHA"; then
            # PR 체크아웃은 base 위에 PR 을 얹은 머지 커밋이라, base 와의 차이가 곧 PR 의 변경이다
            kind=$(git -c core.quotepath=off diff --name-only "$BASE_SHA" HEAD | sh scripts/classify-frontend-changes.sh) || kind=code
          fi
          echo "kind=$kind" | tee -a "$GITHUB_OUTPUT"

  # 잡 `if` 의 뜻: 판정이 성공했고 `none` 이면 건너뛴다. 판정이 실패했으면(출력이 비었으면) 돈다.
  # `!cancelled()` 가 있어야 `needs` 실패에도 이 식을 평가한다(없으면 암묵적 `success()` 가 붙는다).
  verify:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.kind != 'none') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # package.json 이 frontend/ 에 있다. defaults.run.working-directory 는 액션 입력에
      # 적용되지 않으므로 경로를 명시해야 `packageManager`(pnpm 버전 고정)를 읽는다.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # 런타임 이미지(`frontend/frontend-web.Dockerfile`, `node:22-alpine`)와 같은 메이저다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 문서만 바뀐 PR 도 포맷 검사는 돈다 — `.md` 도 prettier 대상이다.
      # 아래 스텝은 `docs` 일 때만 건너뛴다(`== 'code'` 가 아니다). 판정이 실패해 kind 가 비면 전부 돈다.
      - run: pnpm format:check
      - run: pnpm lint
        if: needs.changes.outputs.kind != 'docs'
      - run: pnpm typecheck
        if: needs.changes.outputs.kind != 'docs'
      - run: pnpm test
        if: needs.changes.outputs.kind != 'docs'

      # server/client 경계 오류는 빌드에서만 잡히는 것이 많다.
      # 값은 자리표시자다. 실제 값은 Jenkins 가 Vault 에서 넣는다.
      # 세션 키는 32자 이상이어야 한다(`src/lib/env.server.ts`).
      - run: pnpm build
        if: needs.changes.outputs.kind != 'docs'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          BACKEND_API_URL: http://localhost:8080
          AUTH_SESSION_SECRET: ci-placeholder-secret-at-least-32-characters
          NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ci-placeholder

  # e2e — 화면을 실제 브라우저로 잰다 (#477, #632). 도는 슈트:
  # - `e2e/community` — 레이아웃·불변식·지역 시트·글쓰기·터치 타깃
  # - `e2e/auth` — 가입 → 로그인, 카카오 버튼 위치, 세션 확인 전 폼·헤더 자리
  # - `e2e/layout` — 없는 주소의 404·셸 하나·h1, 기능 루트 redirect(응답만 본다)
  # - `e2e/home/invariants.spec.ts` — 홈 가로 넘침·h1·링크·콘솔 오류·합니다체 0·첫 페인트 BFF 호출 ≤3
  # - `e2e/analysis` — 상권분석 모바일 시트 첫 화면 자리(지름길 위치·카드 줄 수·목록 필터 고정, #648)
  #
  # **백엔드 없이 돈다.** 브라우저가 내보내는 BFF·`/api/auth/*` 호출은 슈트마다 고정 응답으로
  # 가로채고(`e2e/fixtures/community.ts`·`e2e/fixtures/home.ts`·`e2e/fixtures/analysis.ts`·`e2e/auth/signup-to-login.spec.ts`),
  # 가로채지 못한 `/api/bff/*` 호출은 501 로 막아 테스트를 실패시킨다. 레이아웃 슈트는 BFF 를 부르지
  # 않는다(세션 쿠키가 없으면 `/api/auth/me` 는 백엔드에 가지 않는다). 그래서 서버에는 자리표시자 env 만 준다.
  #
  # **프로덕션 빌드(`pnpm start`)로 돈다.** dev 서버보다 배포물에 가깝다. 포트는 5173 이다 —
  # `playwright.config.ts` 의 기본 baseURL 이고, 백엔드 CORS 허용 포트와도 맞춘다.
  # 서버를 먼저 띄우고 기다린다. 서버가 없으면 playwright 의 `webServer` 가 `pnpm dev` 를 띄워
  # 프로덕션 빌드가 아닌 것을 재게 된다.
  #
  # **홈은 불변식만 넣는다.** 래칫(`home-metrics.spec.ts`)은 기준선이 dev 서버 + 실응답 기준이라
  # 프로덕션 빌드·고정 응답에서는 수치가 어긋난다. 히어로·미니 지도(`hero.spec.ts`·`ranking-mini-map.spec.ts`)는
  # 고정하지 않은 실응답(자치구 상세 등)에 기댄다. 셋 다 로컬 전용이다(`frontend/docs/runbook/qa.md` §2).
  # 슈트를 더할 때는 아래 실행 줄에 경로를 더한다 — 디렉터리 단위가 아니라 백엔드 없이 도는 것만 고른다.
  #
  # **필수 체크다.** 관찰 기간(`continue-on-error`)은 끝났다. 이 잡이 깨지면 워크플로도 실패하고 머지가 막힌다.
  # - flaky 를 통과로 세지 않는다. CI 는 `retries: 1` 이라(`playwright.config.ts`) 재시도에서 통과한
  #   테스트도 exit 0 이 된다. `--fail-on-flaky-tests` 로 실패와 아티팩트로 드러낸다. 백엔드 없이 고정 응답으로
  #   도는 슈트라 flaky 는 테스트 결함이다 — 재실행으로 넘기지 말고 원인을 고친다.
  # - FE 코드 변경이 없는 PR(`docs`·`none`)에서는 skipped 로 통과한다. 판정이 실패하면 돈다(`verify` 와 같다).
  #
  # `verify` 에 의존시키지 않는다. 둘은 서로 다른 것을 보고, 직렬로 묶으면 lint 한 줄 때문에
  # 화면 결과를 못 보게 된다.
  e2e:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.kind == 'code') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      BACKEND_API_URL: http://localhost:8080
      AUTH_SESSION_SECRET: ci-placeholder-secret-at-least-32-characters
      NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ci-placeholder
      PLAYWRIGHT_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 브라우저는 node_modules 캐시에 들어가지 않아 따로 캐시한다. playwright 버전이 lockfile 에
      # 고정되므로 lockfile 해시를 키로 쓴다.
      #
      # **복원과 저장을 나눈다.** `actions/cache` 는 잡이 성공해야 post 단계에서 저장한다. 테스트가
      # 깨지는 PR 에서도 다음 실행이 chromium 을 새로 받지 않도록 설치 직후에 따로 저장한다.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # chromium 하나만 받는다(`playwright.config.ts` 의 두 프로젝트 모두 chromium).
      # 캐시가 맞아도 시스템 의존성(apt)은 러너마다 새로 깐다.
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - run: pnpm build

      # 백그라운드 프로세스는 같은 잡의 다음 단계까지 살아 있다.
      # 준비 판정은 `curl -f`(4xx·5xx 면 실패)다. playwright `webServer` 는 200 이상 404 미만일 때만
      # 이미 뜬 서버를 재사용한다. 5xx 를 준비로 읽으면 playwright 가 `pnpm dev -p 5173` 을 띄우다
      # 포트 충돌로 죽어 엉뚱한 원인으로 실패한다. 응답이 멈추는 경우를 위해 시도마다 5초 상한을 둔다.
      # 로그는 `test-results/` 가 아니라 작업 디렉터리에 둔다. playwright 가 실행 시작 때 그 폴더를 비운다.
      # 60초 안에 응답이 없거나 서버가 죽으면 로그를 보여 주고 실패한다.
      - name: Start production server
        run: |
          nohup pnpm start -p 5173 > next-server.log 2>&1 &
          echo $! > next-server.pid
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 -o /dev/null "$PLAYWRIGHT_BASE_URL"; then
              echo "server ready after ${i}s"
              exit 0
            fi
            if ! kill -0 "$(cat next-server.pid)" 2>/dev/null; then
              echo 'server exited before ready'
              cat next-server.log
              exit 1
            fi
            sleep 1
          done
          echo 'server not ready in 60s'
          cat next-server.log
          exit 1

      # `--fail-on-flaky-tests` — 재시도에서 통과한 테스트도 실패로 센다(위 잡 주석).
      - run: pnpm test:e2e e2e/community e2e/auth e2e/layout e2e/home/invariants.spec.ts e2e/analysis --fail-on-flaky-tests

      # **실패했을 때만 올린다.** trace(`test-results/`)로 어느 단언에서 무엇이 그려졌는지 본다.
      # 세션 쿠키는 테스트가 만든 가짜 값이라 실데이터가 담기지 않는다.
      - name: Upload e2e evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/next-server.log
          retention-days: 7
