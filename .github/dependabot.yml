# Dependabot 설정.
#
# 왜 필요한가: 이 설정이 없으면 GitHub 은 보안 알림만 쌓고 갱신 PR 을 올리지 않는다.
# 실제로 2026-09-11 시점 frontend/pnpm-lock.yaml 에 열린 알림이 94 건까지 밀려 있었다.
#
# 저장소 규약 연동:
# - 머지는 rebase and merge 라 브랜치 커밋이 그대로 develop 에 올라간다. 그래서
#   commit-message.prefix 로 `[FE] chore` / `[BE] chore` 형식을 맞춘다(루트 CLAUDE.md).
# - 배포 라벨(`frontend-web` 등)은 일부러 붙이지 않는다. Jenkins 가 그 라벨로 배포
#   대상을 찾으므로, 배포는 사람이 PR 을 확인한 뒤 라벨을 달아 결정한다.
# - 알림 1 건당 PR 1 개가 되면 감당이 안 되므로 groups 로 묶는다.
#
# 2026-09-11 첫 스캔에서 PR 13 건이 한꺼번에 열렸다(#331~#343). 메이저를 그룹에서
# 빼 두면 그룹 밖으로 튕겨 나가 디렉터리마다 개별 PR 이 되기 때문이다. springdoc
# 하나가 8 개 디렉터리에 걸려 PR 8 개가 됐다. `open-pull-requests-limit` 은
# 디렉터리별로 세므로 이 폭주를 막지 못한다. 그래서 메이저도 그룹에 넣되,
# 마이너·패치와 섞이지 않게 별도 그룹으로 나눈다. 그룹은 디렉터리를 가로질러
# 하나의 PR 로 묶이므로(#331 이 11 개 디렉터리를 한 PR 로 처리했다) 같은 의존성이
# 디렉터리 수만큼 늘어나지 않는다.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: '[FE] chore'
    groups:
      # 보안 갱신은 한 PR 로 모아 빨리 넘긴다.
      fe-security:
        applies-to: security-updates
        patterns:
          - '*'
      # 일상 갱신은 한 PR 로 묶는다.
      fe-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      # 메이저도 묶되 마이너·패치와는 분리한다. breaking change 라 검토 단위가
      # 다르고, 섞으면 하나가 깨질 때 일상 갱신까지 같이 막힌다.
      fe-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major

  - package-ecosystem: gradle
    directories:
      - /backend
      - /backend/core/*
      - /backend/cloud/*
      - /backend/service/*
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: '[BE] chore'
    groups:
      be-security:
        applies-to: security-updates
        patterns:
          - '*'
      be-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      # fe-major 와 같은 이유로 분리한다. 2026-09-11 에 여기로 들어왔어야 할
      # springdoc 3.x · spring-ai 2.x · geotools 35.x 가 개별 PR 12 건이 됐다.
      be-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
