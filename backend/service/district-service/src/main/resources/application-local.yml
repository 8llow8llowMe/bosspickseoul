server:
  port: 8082
  shutdown: graceful

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS:3000}
            readTimeout: ${INTERNAL_CLIENT_READ_TIMEOUT_MS:10000}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nowdoboss?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true       # 데이터베이스 URL
    username: ENC(OL9lhGYuBl819xoaLMPAxuTVlN8pJ3GE)
    password: ENC(Q7kGpk90tMWOMI0Eoa6+xqjXROMGqmTxIiKQvkZldzw=)

  jpa:
    open-in-view: true
    defer-datasource-initialization: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        show_sql: true
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 100

# log 관리
logging:
  level:
    # 로거명을 평탄하게 적는다. org.hibernate 아래에 org.hibernate.SQLQuery를 중첩하면
    # 실제 로거명이 org.hibernate.org.hibernate.SQLQuery가 되어 설정이 무효가 된다.
    org.hibernate.type.descriptor.sql: trace
    org.hibernate.SQL: debug

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
