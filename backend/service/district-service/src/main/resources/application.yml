spring:
  application:
    name: ${SPRING_APPLICATION_NAME:district-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: local

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN

# 지도 뷰포트 한 번의 조회가 읽어 올 수 있는 영역 행 수 상한.
# MapViewportProperties 의 코드 기본값과 같은 값을 여기에 그대로 적는다. 어느 설정 소스에도
# 프리픽스가 없으면 record 바인딩 경로에 기대야 하고, 운영자가 조정할 knob 도 눈에 보이지 않는다.
app:
  map:
    analysis-period:
      # 분기를 생략한 지도 요청의 기본 분기(commercial-service GET /api/v1/commercials/periods)를 인스턴스 메모리에 두는 시간(이슈 #464).
      # commercial-service 의 카탈로그 갱신 주기와 같다. 갱신이 실패하면 마지막 성공값을 계속 쓴다.
      cache-ttl: 5m
    viewport:
      # 서울 전량은 자치구 25 · 행정동 424 행이라 이 상한은 사실상 여유값이다.
      max-district-areas: 50
      max-administration-areas: 500
      # 상권만 상한이 빡빡하다. 조회 결과가 그대로 commercial-service Feign GET 의 쿼리
      # 파라미터가 되기 때문이다. 코드 1건당 약 24B, 수신 측 Tomcat 기본
      # max-http-request-header-size 8192B 기준 약 341건에서 요청 라인이 한도를 넘는다.
      max-commercial-areas: 250

# 내부 서비스 Feign 호출 서킷브레이커. 인스턴스명은 -dev/-prod 접미사와 무관한 논리 서비스명이다.
# 4xx(FeignClientException)는 호출한 쪽의 요청 문제이므로 상대 서비스 장애로 집계하지 않는다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$FeignClientException
    instances:
      commercial-service:
        base-config: default
      # 기본 분기 조회(/api/v1/commercials/periods) 전용. 실패가 분석 호출 서킷(commercial-service)을 열지 않게 분리한다(이슈 #464).
      commercial-service-periods:
        base-config: default
