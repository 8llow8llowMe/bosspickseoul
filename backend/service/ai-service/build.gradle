dependencyManagement {
    imports {
        mavenBom 'org.springframework.ai:spring-ai-bom:1.1.8'
    }
}

dependencies {
    implementation project(":core:common-core")
    implementation project(":core:redis-core")
    implementation project(":core:security-core")

    implementation 'org.springframework.ai:spring-ai-ollama'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // Resilience4j CircuitBreaker (내부 Feign 호출 장애 전파 차단)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
