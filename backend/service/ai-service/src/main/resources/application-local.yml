server:
  port: 8085
  shutdown: graceful

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS:3000}
            readTimeout: ${INTERNAL_CLIENT_READ_TIMEOUT_MS:10000}

infra:
  redis:
    mode: standalone
    host: localhost
    port: 6379
    password:
    key-prefix: ${REDIS_KEY_PREFIX:nowdoboss-dev}

ai:
  report:
    cache:
      ttl-seconds: ${AI_REPORT_CACHE_TTL_SECONDS:86400}
    job:
      ttl-seconds: ${AI_REPORT_JOB_TTL_SECONDS:86400}
      usage-ttl-seconds: ${AI_REPORT_JOB_USAGE_TTL_SECONDS:2592000}
      pending-timeout-seconds: ${AI_REPORT_JOB_PENDING_TIMEOUT_SECONDS:30}
      running-timeout-seconds: ${AI_REPORT_JOB_RUNNING_TIMEOUT_SECONDS:300}
  llm:
    provider: ${AI_LLM_PROVIDER:OLLAMA}
    base-url: ${AI_LLM_BASE_URL:http://localhost:11434}
    api-key: ${AI_LLM_API_KEY:}
    model: ${AI_LLM_MODEL:qwen2.5:7b-instruct}
    timeout-ms: ${AI_LLM_TIMEOUT_MS:30000}
    max-tokens: ${AI_LLM_MAX_TOKENS:1200}
    temperature: ${AI_LLM_TEMPERATURE:0.2}
