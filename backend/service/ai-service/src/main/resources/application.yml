spring:
  application:
    name: ${SPRING_APPLICATION_NAME:ai-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: local

infra:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:nowdoboss}

ai:
  report:
    # 계정 단위 LLM 어뷰징 방어. 프로필별 override 가 없어도 동작하도록 공통 기본값을 둔다.
    usage-limit:
      daily-limit: ${AI_REPORT_USAGE_DAILY_LIMIT:30}
    # 원천 데이터 fan-out 전용 풀(aiSourceFetchTaskExecutor). 리포트 워커 풀과 분리해야 교착이 없다.
    # 기본값 16 = 동시 실행 잡 2건(워커 풀 크기) x 한 잡의 최대 조회 8건.
    # 전부 Feign 응답 대기(블로킹 I/O)라 CPU 코어 수와 무관하게 잡아도 된다.
    source-fetch:
      core-pool-size: ${AI_SOURCE_FETCH_CORE_POOL_SIZE:16}
      max-pool-size: ${AI_SOURCE_FETCH_MAX_POOL_SIZE:16}
      queue-capacity: ${AI_SOURCE_FETCH_QUEUE_CAPACITY:64}
      await-termination-seconds: ${AI_SOURCE_FETCH_AWAIT_TERMINATION_SECONDS:30}
  llm:
    # LLM connect timeout. read timeout(timeout-ms)과 달리 프로필별 튜닝 대상이 아니라 공통 기본값만 둔다.
    # Ollama(AiLlmModelConfig)와 OpenAI 호환(OpenAiLlmClientAdapter) 양쪽이 이 값 하나를 쓴다.
    connect-timeout-ms: ${AI_LLM_CONNECT_TIMEOUT_MS:3000}

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN

# 내부 서비스 Feign 호출 서킷브레이커. 인스턴스명은 -dev/-prod 접미사와 무관한 논리 서비스명이다.
# 4xx(FeignClientException)는 호출한 쪽의 요청 문제이므로 상대 서비스 장애로 집계하지 않는다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$FeignClientException
    instances:
      commercial-service:
        base-config: default
      district-service:
        base-config: default
      llm:
        base-config: default
        # LLM 생성은 수십 초~수 분이 정상 범위라 slow-call 판정이 의미가 없다.
        # 기준을 read timeout(AI_LLM_TIMEOUT_MS)과 동일하게 연동해 사실상 비활성화하고
        # (타임아웃보다 오래 걸리는 호출은 존재할 수 없음) 실패율 기준만 사용한다.
        # 값을 하드코딩하면 Vault에서 타임아웃만 올렸을 때 정상 호출이 slow로 집계되어
        # 서킷이 열리는 사고가 난다.
        slow-call-duration-threshold: ${AI_LLM_TIMEOUT_MS:30000}ms
        wait-duration-in-open-state: 30s
