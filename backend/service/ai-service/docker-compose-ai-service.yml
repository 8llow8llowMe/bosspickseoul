x-ai-service-environment: &ai_service_environment
  TIME_ZONE: ${TIME_ZONE}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_APPLICATION_NAME: ${AI_SERVICE_APP_NAME}
  AI_SERVICE_PORT: ${AI_SERVICE_PORT}
  SERVICE_DISCOVERY_HOSTNAME: ${SERVICE_DISCOVERY_HOSTNAME}
  SERVICE_DISCOVERY_PORT: ${SERVICE_DISCOVERY_PORT}
  REDIS_MODE: ${REDIS_MODE}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
  JWT_ACCESS_KEY: ${JWT_ACCESS_KEY}
  AI_LLM_PROVIDER: ${AI_LLM_PROVIDER}
  AI_LLM_BASE_URL: ${AI_LLM_BASE_URL}
  AI_LLM_API_KEY: ${AI_LLM_API_KEY}
  AI_LLM_MODEL: ${AI_LLM_MODEL}
  AI_LLM_TIMEOUT_MS: ${AI_LLM_TIMEOUT_MS}
  AI_LLM_MAX_TOKENS: ${AI_LLM_MAX_TOKENS}
  AI_LLM_TEMPERATURE: ${AI_LLM_TEMPERATURE}
  AI_REPORT_CACHE_TTL_SECONDS: ${AI_REPORT_CACHE_TTL_SECONDS}
  AI_REPORT_JOB_TTL_SECONDS: ${AI_REPORT_JOB_TTL_SECONDS}
  AI_REPORT_JOB_USAGE_TTL_SECONDS: ${AI_REPORT_JOB_USAGE_TTL_SECONDS}
  AI_REPORT_JOB_PENDING_TIMEOUT_SECONDS: ${AI_REPORT_JOB_PENDING_TIMEOUT_SECONDS}
  AI_REPORT_JOB_RUNNING_TIMEOUT_SECONDS: ${AI_REPORT_JOB_RUNNING_TIMEOUT_SECONDS}
  INTERNAL_CLIENT_CONNECT_TIMEOUT_MS: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS}
  INTERNAL_CLIENT_READ_TIMEOUT_MS: ${INTERNAL_CLIENT_READ_TIMEOUT_MS}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  ai-service-dev:
    image: bosspickseoul-ai-service:latest
    container_name: bosspickseoul-ai-service-dev
    labels:
      observability.project: bosspickseoul
      observability.group: service
      observability.service: ai-service
      observability.env: dev
      observability.application: ${AI_SERVICE_APP_NAME}
      observability.deployment: bosspickseoul-ai-service-dev
    build:
      context: .
      dockerfile: ai-service.Dockerfile
    ports:
      - "${AI_SERVICE_PORT_DEV}:${AI_SERVICE_PORT}" # host:container
    environment:
      <<: *ai_service_environment
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  ai-service-prod:
    image: bosspickseoul-ai-service:latest
    container_name: bosspickseoul-ai-service-prod
    labels:
      observability.project: bosspickseoul
      observability.group: service
      observability.service: ai-service
      observability.env: prod
      observability.application: ${AI_SERVICE_APP_NAME}
      observability.deployment: bosspickseoul-ai-service-prod
    build:
      context: .
      dockerfile: ai-service.Dockerfile
    ports:
      - "${AI_SERVICE_PORT_PROD}:${AI_SERVICE_PORT}" # host:container
    environment:
      <<: *ai_service_environment
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    external: true
