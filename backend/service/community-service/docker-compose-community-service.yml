x-community-service-environment: &community_service_environment
  TIME_ZONE: ${TIME_ZONE}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_APPLICATION_NAME: ${COMMUNITY_SERVICE_APP_NAME}
  COMMUNITY_SERVICE_PORT: ${COMMUNITY_SERVICE_PORT}
  SERVICE_DISCOVERY_HOSTNAME: ${SERVICE_DISCOVERY_HOSTNAME}
  SERVICE_DISCOVERY_PORT: ${SERVICE_DISCOVERY_PORT}
  COMMUNITY_DB_URL: ${COMMUNITY_DB_URL}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_ACCESS_KEY: ${JWT_ACCESS_KEY}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
  MINIO_BUCKET: ${MINIO_BUCKET}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_MAX_FILE_BYTES: ${MINIO_MAX_FILE_BYTES:-5242880}
  MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE:-5MB}
  MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE:-30MB}
  CLEANUP_COMMUNITY_ENABLED: ${CLEANUP_COMMUNITY_ENABLED:-false}
  CLEANUP_COMMUNITY_CRON: ${CLEANUP_COMMUNITY_CRON:-0 40 4 * * *}
  CLEANUP_COMMUNITY_RETENTION_DAYS: ${CLEANUP_COMMUNITY_RETENTION_DAYS:-30}
  CLEANUP_COMMUNITY_BATCH_SIZE: ${CLEANUP_COMMUNITY_BATCH_SIZE:-500}
  CLEANUP_COMMUNITY_ORPHAN_MIN_AGE_HOURS: ${CLEANUP_COMMUNITY_ORPHAN_MIN_AGE_HOURS:-24}
  SNOWFLAKE_DATACENTER_ID: ${SNOWFLAKE_DATACENTER_ID}
  SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  community-service-dev:
    image: bosspickseoul-community-service:latest
    container_name: bosspickseoul-community-service-dev
    labels:
      observability.project: bosspickseoul
      observability.group: service
      observability.service: community-service
      observability.env: dev
      observability.application: ${COMMUNITY_SERVICE_APP_NAME}
      observability.deployment: bosspickseoul-community-service-dev
    build:
      context: .
      dockerfile: community-service.Dockerfile
    ports:
      - "${COMMUNITY_SERVICE_PORT_DEV}:${COMMUNITY_SERVICE_PORT}" # host:container
    environment:
      <<: *community_service_environment
    # 컨테이너 메모리 상한. JVM heap은 Dockerfile의 MaxRAMPercentage가 이 값을 기준으로 산정한다.
    deploy:
      resources:
        limits:
          memory: ${COMMUNITY_SERVICE_MEM_LIMIT_DEV:-512m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  community-service-prod:
    image: bosspickseoul-community-service:latest
    container_name: bosspickseoul-community-service-prod
    labels:
      observability.project: bosspickseoul
      observability.group: service
      observability.service: community-service
      observability.env: prod
      observability.application: ${COMMUNITY_SERVICE_APP_NAME}
      observability.deployment: bosspickseoul-community-service-prod
    build:
      context: .
      dockerfile: community-service.Dockerfile
    ports:
      - "${COMMUNITY_SERVICE_PORT_PROD}:${COMMUNITY_SERVICE_PORT}" # host:container
    environment:
      <<: *community_service_environment
    deploy:
      resources:
        limits:
          memory: ${COMMUNITY_SERVICE_MEM_LIMIT_PROD:-768m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    external: true
