server:
  port: ${COMMUNITY_SERVICE_PORT}
  shutdown: graceful

spring:
  cloud:
    config:
      enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${COMMUNITY_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: true
    defer-datasource-initialization: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        show_sql: false
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 100

eureka:
  instance:
    # Docker 컨테이너 환경: 컨테이너 IP로 등록해야 게이트웨이 lb:// 라우팅이
    # 컨테이너 hostname(컨테이너 ID) DNS 해석 실패 없이 연결된다.
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    serviceUrl:
      defaultZone: http://${SERVICE_DISCOVERY_HOSTNAME}:${SERVICE_DISCOVERY_PORT}/eureka/

app:
  security:
    jwt:
      resource:
        access-key: ${JWT_ACCESS_KEY}

snowflake:
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID}
  worker-id: ${SNOWFLAKE_WORKER_ID}

infra:
  storage:
    # 백엔드는 MinIO 와 다른 호스트에 있으므로 컨테이너명이 아니라 사설 IP 로 접속한다.
    endpoint: ${MINIO_ENDPOINT}
    # 브라우저가 이미지를 조회할 공개 주소. DB 에는 key 만 저장하고 응답 시 이 값으로 URL 을 조립한다.
    public-url: ${MINIO_PUBLIC_URL}
    bucket: ${MINIO_BUCKET}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    max-file-bytes: ${MINIO_MAX_FILE_BYTES:5242880}
