spring:
  application:
    name: ${SPRING_APPLICATION_NAME:community-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: local
  servlet:
    multipart:
      # 업로드 상한. 스토리지 자체 검증(infra.storage.max-file-bytes)과 함께 2중으로 막는다.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:30MB}


# 내부 서비스 Feign 호출 서킷브레이커. 인스턴스명은 -dev/-prod 접미사와 무관한 논리 서비스명이다.
# 4xx(FeignClientException)는 호출한 쪽의 요청 문제이므로 상대 서비스 장애로 집계하지 않는다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$FeignClientException
    instances:
      district-service:
        base-config: default

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN

app:
  cleanup:
    community:
      # 소프트 삭제 행 하드 삭제 + 미참조 이미지 객체 회수. 단일 인스턴스 전제.
      enabled: ${CLEANUP_COMMUNITY_ENABLED:false}
      cron: ${CLEANUP_COMMUNITY_CRON:0 40 4 * * *}
      retention-days: ${CLEANUP_COMMUNITY_RETENTION_DAYS:30}
      batch-size: ${CLEANUP_COMMUNITY_BATCH_SIZE:500}
      # 업로드 직후 아직 게시글에 연결되지 않은 객체를 지우지 않기 위한 여유. 작성 중 이탈을 감안해 넉넉히 둔다.
      orphan-min-age-hours: ${CLEANUP_COMMUNITY_ORPHAN_MIN_AGE_HOURS:24}
