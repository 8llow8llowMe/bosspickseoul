server:
  port: 8081
  shutdown: graceful

# 소셜 로그인 provider 설정. 로컬은 자격증명이 없으면 소셜 로그인 시점에만 실패한다.
oauth:
  kakao:
    client-id: ${OAUTH_KAKAO_CLIENT_ID:}
    client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
    redirect-uri: ${OAUTH_KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao/callback}
    scope:
      - profile_nickname
      - profile_image
      - account_email
  naver:
    client-id: ${OAUTH_NAVER_CLIENT_ID:}
    client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
    redirect-uri: ${OAUTH_NAVER_REDIRECT_URI:http://localhost:5173/oauth/naver/callback}

spring:
  # 이메일 인증코드 발송용 SMTP. 로컬은 자격증명이 없으면 발송 시점에만 실패한다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nowdoboss?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true       # 데이터베이스 URL
    username: ENC(OL9lhGYuBl819xoaLMPAxuTVlN8pJ3GE)
    password: ENC(Q7kGpk90tMWOMI0Eoa6+xqjXROMGqmTxIiKQvkZldzw=)

  jpa:
    open-in-view: true
    defer-datasource-initialization: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        show_sql: true
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 100

# log 관리
logging:
  level:
    org.hibernate:
      type.descriptor.sql: trace
      org.hibernate.SQLQuery: debug

# snowflake
snowflake:
  datacenter-id: 1
  worker-id: 1

# Redis
infra:
  redis:
    mode: standalone
    host: localhost
    port: 6379
    password:
    key-prefix: ${REDIS_KEY_PREFIX:bosspickseoul-dev}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

jwt:
