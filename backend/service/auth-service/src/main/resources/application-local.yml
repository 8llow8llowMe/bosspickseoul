server:
  port: 8081
  shutdown: graceful

# 소셜 로그인 provider 설정. 로컬은 자격증명이 없으면 소셜 로그인 시점에만 실패한다.
oauth:
  kakao:
    client-id: ${OAUTH_KAKAO_CLIENT_ID:}
    client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
    redirect-uri: ${OAUTH_KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao/callback}
    scope:
      - profile_nickname
      - profile_image
      - account_email
  naver:
    client-id: ${OAUTH_NAVER_CLIENT_ID:}
    client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
    redirect-uri: ${OAUTH_NAVER_REDIRECT_URI:http://localhost:5173/oauth/naver/callback}

spring:
  # 이메일 인증코드 발송용 SMTP. 로컬은 자격증명이 없으면 발송 시점에만 실패한다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nowdoboss?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true       # 데이터베이스 URL
    username: ENC(OL9lhGYuBl819xoaLMPAxuTVlN8pJ3GE)
    password: ENC(Q7kGpk90tMWOMI0Eoa6+xqjXROMGqmTxIiKQvkZldzw=)

  jpa:
    open-in-view: true
    defer-datasource-initialization: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        show_sql: true
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 100

# log 관리
logging:
  level:
    # 로거명을 평탄하게 적는다. org.hibernate 아래에 org.hibernate.SQLQuery를 중첩하면
    # 실제 로거명이 org.hibernate.org.hibernate.SQLQuery가 되어 설정이 무효가 된다.
    org.hibernate.type.descriptor.sql: trace
    org.hibernate.SQL: debug

# snowflake
snowflake:
  datacenter-id: 1
  worker-id: 1

# 일반 로그인 실패 횟수 제한 / 잠금
auth:
  login:
    max-failure-count: ${AUTH_LOGIN_MAX_FAILURE_COUNT:5}
    lock-duration: ${AUTH_LOGIN_LOCK_DURATION:PT10M}

# Redis
infra:
  redis:
    mode: standalone
    host: localhost
    port: 6379
    password:
    key-prefix: ${REDIS_KEY_PREFIX:bosspickseoul-dev}
  storage:
    endpoint: http://localhost:9000
    public-url: http://localhost:9000
    bucket: bosspickseoul-local
    access-key: minioadmin
    secret-key: minioadmin
    max-file-bytes: 5242880

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

jwt:
  access-key: ENC(YDO9DGO7lP8iCqeTNW/SXWCv0697ep+bbGvMnjoJfMDEtWy1Zq/yfZDsovoggEcmLLOtZfHSpLYoRO0YEUlrOl3CvD5KWXo55haCMx7cZMg=)

# 가입 동의 이력(member_consent)에 남길 법적 문서 판과 탈퇴 회원 정보 보관 기간.
# 문서 판의 정본은 프론트 frontend/src/lib/legal/{terms-of-service,privacy-policy}.ts 의 version 이다.
# 약관·처리방침을 개정하면 프론트 상수와 이 값을 같은 배포에 함께 바꾼다 — 어긋나면 화면에 보여준 판과
# 이력에 남는 판이 달라진다. local·dev·prod 세 파일을 함께 고치고, 1.10 이 1.1 로 읽히지 않게 따옴표로 감싼다.
# withdrawn-retention: 탈퇴 회원의 이메일·동의 이력 보관 기간(탈퇴 시점부터). 실제 파기 작업은 후속 이슈다.
legal:
  terms-version: "1.0"
  privacy-version: "1.1"
  withdrawn-retention: P365D
