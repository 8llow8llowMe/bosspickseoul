# Optional standalone profile. Jenkins 의 상시 batch-service 는 이 프로파일 없이
# BATCH_POLICY_ENABLED=true 만으로도 수집이 켜진다(application.yml on-property).
# BATCH_DB_URL 은 district 를 유지한다. policy 는 COMMERCIAL_DB_URL.
# Quartz/Spring Batch 메타는 district 의 QRTZ_* / BATCH_* 를 쓴다.
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BATCH_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  quartz:
    auto-startup: true
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.threadPool.threadCount: 2

batch:
  policy:
    enabled: ${BATCH_POLICY_ENABLED:false}

snowflake:
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
  worker-id: ${SNOWFLAKE_WORKER_ID:1}
