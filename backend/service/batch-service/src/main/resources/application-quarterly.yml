# CLI-only imports. Use this profile alone, with an explicitly selected DB and schema allowlist.
spring:
  main:
    web-application-type: none
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BATCH_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false

# batch.dataset-source.* 는 상시 컨테이너(자동 최신화)도 쓰므로 application.yml 에 있다.
