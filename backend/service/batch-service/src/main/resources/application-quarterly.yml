# CLI-only imports. Use this profile alone, with an explicitly selected DB and schema allowlist.
spring:
  main:
    web-application-type: none
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BATCH_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  sql:
    init:
      mode: never
  # 1회 실행 CLI 는 스케줄을 돌리지 않는다. 메모리 스토어로 두어 commercial 의 QRTZ_* 에 붙지 않게 한다.
  # (JDBC 로 뜨면 그 스키마에 저장된 트리거를 발화하거나, 테이블이 없어 ClusterManager ERROR 를 남긴다.)
  quartz:
    auto-startup: false
    job-store-type: memory

eureka:
  client:
    enabled: false

# batch.dataset-source.* 는 상시 컨테이너(자동 최신화)도 쓰므로 application.yml 에 있다.
