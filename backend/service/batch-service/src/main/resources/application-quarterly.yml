# CLI-only imports. Use this profile alone, with an explicitly selected DB and schema allowlist.
spring:
  main:
    web-application-type: none
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BATCH_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false

batch:
  dataset-source:
    api-key: ${SEOUL_OPEN_DATA_API_KEY:}
    base-url: http://openapi.seoul.go.kr:8088
    raw-directory: ${BATCH_RAW_DIRECTORY:./data/raw}
    timeout-seconds: 30
    max-attempts: 3
    # Korean CSV header -> Open API column code. Every CSV header must resolve to a code or the run stops,
    # so the CSV and API routes stage identical payload keys. The code side is the live API column set
    # (checked 2026-09-08); the Korean side follows the published CSV headers, so add a line if a file
    # names a column differently rather than loosening the check.
