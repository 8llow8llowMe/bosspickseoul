spring:
  application:
    name: ${SPRING_APPLICATION_NAME:batch-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: local
  quartz:
    auto-startup: false
    job-store-type: memory
    wait-for-jobs-to-complete-on-shutdown: true

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN
    # 서울 Open API URL 경로에 API 키가 들어간다. JDK HttpClient 가 요청 URI 를 남기지 않게 한다.
    java.net.http: WARN

snowflake:
  datacenter-id: 1
  worker-id: 1

batch:
  policy:
    enabled: ${BATCH_POLICY_ENABLED:false}
    collect-cron: ${BATCH_POLICY_COLLECT_CRON:0 0 6 * * ?}
    purge-cron: ${BATCH_POLICY_PURGE_CRON:0 30 6 * * ?}
    stale-ratio: 0.5
    purge-grace-days: 30
    bizinfo:
      base-url: https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
      crtfc-key: ${BIZINFO_CRTFC_KEY:}
      hashtags: 소상공인
      page-size: 100
      max-pages: 20
      timeout-seconds: 30
      max-attempts: 3
  # commercial 스키마. 정책 수집·분기 적재 자동 최신화·스테이징 정리 중 하나라도 켜지면 두 번째 풀로 연다.
  # 모두 꺼져 있으면 기본 DataSource 를 그대로 쓴다(quarterly CLI 는 COMMERCIAL_DB_URL 을 받지 않는다).
  commercial:
    datasource:
      url: ${COMMERCIAL_DB_URL:}
      username: ${DB_USERNAME:}
      password: ${DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
  # 서울 열린데이터광장 Open API 와 원천 보관 위치. quarterly CLI 와 상시 컨테이너의 자동 최신화가 같이 쓴다.
  # API 키가 비어 있어도 기동에는 영향이 없다. API 세션을 열 때만 검사한다(자동 최신화는 가드가 기동 시 검사).
  dataset-source:
    api-key: ${SEOUL_OPEN_DATA_API_KEY:}
    base-url: http://openapi.seoul.go.kr:8088
    raw-directory: ${BATCH_RAW_DIRECTORY:./data/raw}
    timeout-seconds: 30
    max-attempts: 3
    # CSV 한글 헤더 -> 컬럼 코드 표는 classpath seoul/csv-header-aliases.csv 에 있다.
    # 배포 파일이 헤더를 다르게 적을 때만 여기서 한 줄씩 덧붙인다. 예: "[개업_비율]": OPBIZ_RT
    header-aliases: {}
    # area_boundary / commercial_region_mapping 이 있는 스키마. district-service 소유라
    # 팩트를 쓰는 commercial 스키마와 다르다. --source=LEGACY 를 쓸 때만 필요하다.
    legacy-spatial-schema: ${BATCH_LEGACY_SPATIAL_SCHEMA:}
  # 분기 적재 자동 최신화(이슈 #445). 켜면 매일 원천을 탐지해 "마지막 게시 분기 다음" 분기만 적재한다. 백필은 수동 CLI 다.
  # publish=false 면 탐지·수집·dry-run 까지만 한다. 롤아웃은 false 로 시작해 Vault 에서 true 로 올린다.
  dataset-refresh:
    enabled: ${BATCH_DATASET_REFRESH_ENABLED:false}
    cron: ${BATCH_DATASET_REFRESH_CRON:0 0 5 * * ?}
    publish: ${BATCH_DATASET_REFRESH_PUBLISH:false}
    spatial-version: ${BATCH_DATASET_REFRESH_SPATIAL_VERSION:legacy-20233}
    schema-version: seoul-v1
    # 키당 하루 1,000회. 수동 CLI 가 같은 키를 쓰므로 여유를 남긴다.
    max-api-calls-per-run: 600
    # 데이터셋 1종이 한 run 에서 게시할 최대 분기 수. 상시 컨테이너 메모리 상한(512m)을 지키려고 1 로 둔다.
    max-quarters-per-run: 1
    tolerance: 0.2
    failure-cooldown-days: 7
  # 분기 적재 스테이징 정리(주간, 기본 off). dataset_staging / dataset_rejected_row 만 지우고, 활성 릴리스가 가리키는 run 은 제외한다.
  staging-purge:
    enabled: ${BATCH_STAGING_PURGE_ENABLED:false}
    cron: ${BATCH_STAGING_PURGE_CRON:0 0 4 ? * SUN}
    published-retention-days: 30
    unpublished-retention-days: 7
    chunk-size: 5000

---
# Quartz JDBC JobStore. JobStore 는 기본 DataSource(BATCH_DB_URL, district) 의 QRTZ_* 를 쓴다.
# policy / 분기 적재 행은 COMMERCIAL_DB_URL 로 나간다.
#
# 주의: spring.config.activate 는 on-profile / on-cloud-platform 만 지원한다(Spring Boot 3.5). 아래 on-property 는
# 무시되어 이 문서는 모든 프로파일에서 항상 적용된다. 그래서 정책 수집·자동 최신화·스테이징 정리가 어느 것이 켜져도
# Quartz 는 JDBC 로 뜨고, 트리거 등록은 각 *QuartzScheduleConfig 의 @ConditionalOnProperty 가 가른다.
# 조건부로 바꾸려면 세 플래그를 모두 봐야 한다(DatasetRefreshPropertiesTest 가 자동 최신화 쪽을 고정한다).
spring:
  config:
    activate:
      on-property: batch.policy.enabled
  quartz:
    auto-startup: true
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.threadPool.threadCount: 2
