spring:
  application:
    name: ${SPRING_APPLICATION_NAME:batch-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: local
  quartz:
    auto-startup: false
    job-store-type: memory
    wait-for-jobs-to-complete-on-shutdown: true

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN

snowflake:
  datacenter-id: 1
  worker-id: 1

batch:
  policy:
    enabled: false
    collect-cron: ${BATCH_POLICY_COLLECT_CRON:0 0 6 * * ?}
    purge-cron: ${BATCH_POLICY_PURGE_CRON:0 30 6 * * ?}
    stale-ratio: 0.5
    purge-grace-days: 30
    bizinfo:
      base-url: https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
      crtfc-key: ${BIZINFO_CRTFC_KEY:}
      hashtags: 소상공인
      page-size: 100
      max-pages: 20
      timeout-seconds: 30
      max-attempts: 3
