x-batch-service-environment: &batch_service_environment
  TIME_ZONE: ${TIME_ZONE}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_APPLICATION_NAME: ${BATCH_SERVICE_APP_NAME}
  BATCH_SERVICE_PORT: ${BATCH_SERVICE_PORT}
  SERVICE_DISCOVERY_HOSTNAME: ${SERVICE_DISCOVERY_HOSTNAME}
  SERVICE_DISCOVERY_PORT: ${SERVICE_DISCOVERY_PORT}
  BATCH_DB_URL: ${BATCH_DB_URL}
  COMMERCIAL_DB_URL: ${COMMERCIAL_DB_URL}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  BATCH_AREA_BOUNDARY_IMPORT_SOURCE_DIR: ${BATCH_AREA_BOUNDARY_IMPORT_SOURCE_DIR}
  BATCH_POLICY_ENABLED: ${BATCH_POLICY_ENABLED:-false}
  BIZINFO_CRTFC_KEY: ${BIZINFO_CRTFC_KEY:-}
  BATCH_ALLOWED_SCHEMAS: ${BATCH_ALLOWED_SCHEMAS:-}
  BATCH_POLICY_COLLECT_CRON: ${BATCH_POLICY_COLLECT_CRON:-}
  BATCH_POLICY_PURGE_CRON: ${BATCH_POLICY_PURGE_CRON:-}
  # 분기 적재 자동 최신화(이슈 #445). 기본 off. 켜도 PUBLISH=false 면 탐지·수집·dry-run 까지만 한다.
  # CRON / SPATIAL_VERSION 이 비면 application.yml 기본값(05:00 KST, legacy-20233)을 쓴다.
  BATCH_DATASET_REFRESH_ENABLED: ${BATCH_DATASET_REFRESH_ENABLED:-false}
  BATCH_DATASET_REFRESH_PUBLISH: ${BATCH_DATASET_REFRESH_PUBLISH:-false}
  BATCH_DATASET_REFRESH_CRON: ${BATCH_DATASET_REFRESH_CRON:-}
  BATCH_DATASET_REFRESH_SPATIAL_VERSION: ${BATCH_DATASET_REFRESH_SPATIAL_VERSION:-}
  SEOUL_OPEN_DATA_API_KEY: ${SEOUL_OPEN_DATA_API_KEY:-}
  # 수집 페이지 보관 위치. batch-service-dev 는 batch-service-job 과 같은 batch-raw 볼륨을 여기 붙인다.
  BATCH_RAW_DIRECTORY: /app/data/raw
  BATCH_LEGACY_SPATIAL_SCHEMA: ${BATCH_LEGACY_SPATIAL_SCHEMA:-}
  # 분기 적재 스테이징 정리(주간, 기본 off). CRON 이 비면 일요일 04:00 KST.
  BATCH_STAGING_PURGE_ENABLED: ${BATCH_STAGING_PURGE_ENABLED:-false}
  BATCH_STAGING_PURGE_CRON: ${BATCH_STAGING_PURGE_CRON:-}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  batch-service-dev:
    image: bosspickseoul-batch-service:latest
    container_name: bosspickseoul-batch-service-dev
    labels:
      observability.project: bosspickseoul
      observability.group: service
      observability.service: batch-service
      observability.env: dev
      observability.application: ${BATCH_SERVICE_APP_NAME}
      observability.deployment: bosspickseoul-batch-service-dev
    build:
      context: .
      dockerfile: batch-service.Dockerfile
    ports:
      - "${BATCH_SERVICE_PORT_DEV}:${BATCH_SERVICE_PORT}" # host:container
    environment:
      <<: *batch_service_environment
    # 자동 최신화가 받은 원천 페이지(dataset_release.raw_location)를 수동 CLI(batch-service-job)와 같은 볼륨에 둔다.
    # 재배포(rsync --delete)와 컨테이너 교체에도 남아야 ARCHIVE 재생과 사후 점검이 된다.
    volumes:
      - batch-raw:/app/data/raw
    # 컨테이너 메모리 상한. JVM heap은 Dockerfile의 MaxRAMPercentage가 이 값을 기준으로 산정한다.
    deploy:
      resources:
        limits:
          memory: ${BATCH_SERVICE_MEM_LIMIT_DEV:-512m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  batch-service-prod:
    image: bosspickseoul-batch-service:latest
    container_name: bosspickseoul-batch-service-prod
    labels:
      observability.project: bosspickseoul
      observability.group: service
      observability.service: batch-service
      observability.env: prod
      observability.application: ${BATCH_SERVICE_APP_NAME}
      observability.deployment: bosspickseoul-batch-service-prod
    build:
      context: .
      dockerfile: batch-service.Dockerfile
    ports:
      - "${BATCH_SERVICE_PORT_PROD}:${BATCH_SERVICE_PORT}" # host:container
    environment:
      <<: *batch_service_environment
    deploy:
      resources:
        limits:
          memory: ${BATCH_SERVICE_MEM_LIMIT_PROD:-768m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  # 분기 적재 1회 실행용. `--profile job` 을 줄 때만 뜨므로 Jenkins 의 `up ... batch-service-dev` 는 이 서비스를 띄우지 않는다.
  # 배포된 이미지를 그대로 쓰고(build 없음), `docker compose run --rm` 과 충돌하지 않게 container_name 을 두지 않는다.
  # 절차: backend/docs/services/batch-quarterly-import.md 「10. 개발서버에서 실행」
  batch-service-job:
    image: bosspickseoul-batch-service:latest
    # 이미지는 Jenkins 배포가 이 호스트에서 빌드한다. 없으면 레지스트리로 가지 말고 바로 실패한다.
    pull_policy: never
    profiles: ["job"]
    labels:
      observability.project: bosspickseoul
      observability.group: service
      observability.service: batch-service
      observability.env: dev
      observability.application: batch-service-job
      observability.deployment: bosspickseoul-batch-service-job
    # BATCH_QUARTERLY_* 잡 파라미터와 BATCH_ALLOWED_SCHEMAS 는 여기 선언하지 않는다. 선언하지 않은 키는
    # .env.runtime(Vault)에 있어도 컨테이너로 가지 않으므로, 실행마다 `docker compose run -e ...` 로만 들어온다.
    # 허용 스키마를 빼먹으면 BatchTargetGuard 가 거부한다(fail-closed). 상시 컨테이너의 정책 수집용 값을 물려받지 않는다.
    environment:
      TIME_ZONE: ${TIME_ZONE}
      SPRING_PROFILES_ACTIVE: quarterly
      # 분기 적재 대상은 commercial 스키마다. 상시 컨테이너의 BATCH_DB_URL(district)을 쓰지 않는다.
      # 다른 스키마로 돌릴 때는 `run -e BATCH_DB_URL=...` 로 덮어쓴다.
      BATCH_DB_URL: ${COMMERCIAL_DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SEOUL_OPEN_DATA_API_KEY: ${SEOUL_OPEN_DATA_API_KEY:-}
      BATCH_RAW_DIRECTORY: /app/data/raw
      BATCH_LEGACY_SPATIAL_SCHEMA: ${BATCH_LEGACY_SPATIAL_SCHEMA:-}
    # Jenkins 배포가 서비스 디렉터리를 `rsync --delete` 하므로 bind mount 대신 named volume 을 쓴다.
    # batch-raw 는 ARCHIVE 재생이 읽는 dataset_release.raw_location 을 보존하고, batch-input 은 CSV/GeoJSON 입력을 둔다.
    volumes:
      - batch-raw:/app/data/raw
      - batch-input:/app/data/input
    deploy:
      resources:
        limits:
          memory: ${BATCH_SERVICE_MEM_LIMIT_JOB:-1g}
    restart: "no"
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    external: true

# compose 프로젝트명(-p)이 바뀌어도 같은 볼륨을 보도록 이름을 고정한다.
volumes:
  batch-raw:
    name: bosspickseoul-batch-service-raw
  batch-input:
    name: bosspickseoul-batch-service-input
