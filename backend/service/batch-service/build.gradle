dependencies {
    implementation project(":core:common-core")
    implementation project(":core:persistence-core")
    // 데이터셋 이름·Open API 서비스명 계약(DatasetKey). 배치의 Dataset enum 이 식별자를 여기서 읽는다
    implementation project(":core:shared-commercial")

    // Spring Batch
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // JDBC
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // Quartz JDBC JobStore (scheduler 프로파일)
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // MySQL JDBC
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Eureka Client for Service Discovery
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
}
