spring:
  application:
    name: ${SPRING_APPLICATION_NAME:commercial-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: local
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          # dataset_* 테이블은 batch-service 가 quarterly-dataset-schema.sql 로 만들고 소유한다.
          # 이 서비스는 읽기용 엔티티로 미러링만 하므로 ddl-auto(update) 가 그 테이블을 만들지 않게 제외한다.
          schema_filter_provider: com.followfollowme.bosspickseoul.global.config.DatasetSchemaFilterProvider
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # 인기 순위 이벤트는 유실 허용 부가 데이터 — 브로커 장애 시 요청 스레드를 잡아두지 않도록
      # 블로킹/재시도 상한을 짧게 둔다. max.block.ms 가 send() 호출의 최대 대기 시간이다.
      acks: "1"
      retries: 1
      properties:
        enable.idempotence: false
        max.block.ms: 1000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      group-id: commercial-ranking
      auto-offset-reset: latest

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN

app:
  dataset:
    # 분기 적재 배치가 게시한 dataset_fact 를 읽는 경로. false(기본)면 모든 조회가 레거시 팩트 테이블로 간다.
    # true 여도 read-from-period 이전 분기와 활성 release 가 없는 분기는 레거시로 간다.
    # 켜기 전에 대상 스키마에 quarterly-dataset-schema.sql 이 적용돼 있어야 한다 (없으면 기동 실패).
    read-enabled: ${DATASET_READ_ENABLED:false}
    # 활성 release 슬롯의 공간·스키마 버전. 새 폴리곤 기준으로 팩트를 재게시한 뒤 이 값만 바꿔 전환한다.
    spatial-version: ${DATASET_SPATIAL_VERSION:legacy-20233}
    schema-version: ${DATASET_SCHEMA_VERSION:seoul-v1}
    # 이 분기(포함)부터만 데이터셋 경로를 쓴다. 백필된 과거 분기가 조용히 바뀌는 것을 막는다.
    read-from-period: ${DATASET_READ_FROM_PERIOD:20241}
    # 슬롯 -> run_id 캐시 유지 시간. 게시는 분기당 한 번이므로 stale 상한만 명확하면 된다.
    resolver-cache-ttl: 60s
  share-link:
    # 공유 링크 유효 기간(일). 같은 화면을 다시 공유하면 이 기간만큼 만료가 연장된다.
    ttl-days: 90
  cleanup:
    share-link:
      # 만료 공유 링크 정리. 단일 인스턴스 전제이며, 인스턴스를 늘리면 한 대만 true 로 둔다.
      enabled: ${CLEANUP_SHARE_LINK_ENABLED:false}
      cron: ${CLEANUP_SHARE_LINK_CRON:0 20 4 * * *}
      # 만료 후 이 기간은 남겨 둔다. 만료 직후 접근을 404 가 아니라 410(만료됨)으로 안내하기 위해서다.
      retention-days: ${CLEANUP_SHARE_LINK_RETENTION_DAYS:30}
      batch-size: ${CLEANUP_SHARE_LINK_BATCH_SIZE:500}
  ranking:
    # false(기본)면 Kafka producer/consumer 빈이 등록되지 않아 브로커 없이도 정상 기동한다.
    # 인기 순위 조회 API 는 Redis 만 사용하므로 이 플래그와 무관하게 항상 활성이다.
    enabled: ${RANKING_ENABLED:false}
    events-topic: ${RANKING_EVENTS_TOPIC:bosspick.analysis-events}
    window-hours: 24
    max-size: 50
    # 토픽이 없으면 기동 시 KafkaAdmin 이 생성한다. 브로커의 auto.create.topics.enable 과 무관한
    # 별도 admin API 를 쓰므로 브로커 설정을 바꾸지 않아도 된다. 이미 있으면 건너뛴다.
    # 복제 계수는 브로커 수를 넘을 수 없다. 3노드 클러스터는 3, 단일 브로커 로컬은 1 로 둔다.
    topic-partitions: ${RANKING_TOPIC_PARTITIONS:3}
    topic-replicas: ${RANKING_TOPIC_REPLICAS:1}

# 내부 서비스 Feign 호출 서킷브레이커. 인스턴스명은 -dev/-prod 접미사와 무관한 논리 서비스명이다.
# 4xx(FeignClientException)는 호출한 쪽의 요청 문제이므로 상대 서비스 장애로 집계하지 않는다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$FeignClientException
    instances:
      district-service:
        base-config: default
