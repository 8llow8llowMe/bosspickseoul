server:
  port: 8083
  shutdown: graceful

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS:3000}
            readTimeout: ${INTERNAL_CLIENT_READ_TIMEOUT_MS:10000}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nowdoboss?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true
    username: ENC(OL9lhGYuBl819xoaLMPAxuTVlN8pJ3GE)
    password: ENC(Q7kGpk90tMWOMI0Eoa6+xqjXROMGqmTxIiKQvkZldzw=)

  jpa:
    open-in-view: true
    defer-datasource-initialization: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        show_sql: true
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 100


logging:
  level:
    # 로거명을 평탄하게 적는다. org.hibernate 아래에 org.hibernate.SQLQuery를 중첩하면
    # 실제 로거명이 org.hibernate.org.hibernate.SQLQuery가 되어 설정이 무효가 된다.
    org.hibernate.type.descriptor.sql: trace
    org.hibernate.SQL: debug

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Resource Server 검증 키. 바인딩 prefix는 app.security.jwt.resource 이므로
# jwt.access-key 로 두면 값이 주입되지 않아 기동 시 NPE가 발생한다. (auth-service 발급 키와 동일 값)
app:
  security:
    jwt:
      resource:
        access-key: ENC(YDO9DGO7lP8iCqeTNW/SXWCv0697ep+bbGvMnjoJfMDEtWy1Zq/yfZDsovoggEcmLLOtZfHSpLYoRO0YEUlrOl3CvD5KWXo55haCMx7cZMg=)

# 로컬은 랭킹 파이프라인 비활성(app.ranking.enabled 기본 false) — Kafka 없이 기동 가능.
# Redis 연결 정보는 빈 생성에 필요하므로 명시한다 (Redis 미기동이어도 lazy 연결이라 부팅에는 지장 없음).
infra:
  redis:
    mode: STANDALONE
    host: localhost
    port: 6379
    password:
    key-prefix: bosspickseoul-local
