x-commercial-service-environment: &commercial_service_environment
  TIME_ZONE: ${TIME_ZONE}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_APPLICATION_NAME: ${COMMERCIAL_SERVICE_APP_NAME}
  COMMERCIAL_SERVICE_PORT: ${COMMERCIAL_SERVICE_PORT}
  SERVICE_DISCOVERY_HOSTNAME: ${SERVICE_DISCOVERY_HOSTNAME}
  SERVICE_DISCOVERY_PORT: ${SERVICE_DISCOVERY_PORT}
  COMMERCIAL_DB_URL: ${COMMERCIAL_DB_URL}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_ACCESS_KEY: ${JWT_ACCESS_KEY}
  REDIS_MODE: ${REDIS_MODE}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
  # 인기 순위 파이프라인. RANKING_ENABLED=false(기본)면 Kafka 없이도 정상 기동한다.
  # 토픽은 기동 시 KafkaAdmin 이 만들며, 복제 계수는 브로커 수를 넘을 수 없다(3노드=3, 단일=1).
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
  RANKING_ENABLED: ${RANKING_ENABLED:-false}
  RANKING_EVENTS_TOPIC: ${RANKING_EVENTS_TOPIC:-bosspick.analysis-events}
  RANKING_TOPIC_PARTITIONS: ${RANKING_TOPIC_PARTITIONS:-3}
  RANKING_TOPIC_REPLICAS: ${RANKING_TOPIC_REPLICAS:-1}
  SNOWFLAKE_DATACENTER_ID: ${SNOWFLAKE_DATACENTER_ID}
  SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID}
  DISTRICT_SERVICE_APP_NAME: ${DISTRICT_SERVICE_APP_NAME}
  INTERNAL_CLIENT_CONNECT_TIMEOUT_MS: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS}
  INTERNAL_CLIENT_READ_TIMEOUT_MS: ${INTERNAL_CLIENT_READ_TIMEOUT_MS}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  commercial-service-dev:
    image: bosspickseoul-commercial-service:latest
    container_name: bosspickseoul-commercial-service-dev
    labels:
      observability.project: bosspickseoul
      observability.group: service
      observability.service: commercial-service
      observability.env: dev
      observability.application: ${COMMERCIAL_SERVICE_APP_NAME}
      observability.deployment: bosspickseoul-commercial-service-dev
    build:
      context: .
      dockerfile: commercial-service.Dockerfile
    ports:
      - "${COMMERCIAL_SERVICE_PORT_DEV}:${COMMERCIAL_SERVICE_PORT}" # host:container
    environment:
      <<: *commercial_service_environment
    # 컨테이너 메모리 상한. JVM heap은 Dockerfile의 MaxRAMPercentage가 이 값을 기준으로 산정한다.
    deploy:
      resources:
        limits:
          memory: ${COMMERCIAL_SERVICE_MEM_LIMIT_DEV:-512m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  commercial-service-prod:
    image: bosspickseoul-commercial-service:latest
    container_name: bosspickseoul-commercial-service-prod
    labels:
      observability.project: bosspickseoul
      observability.group: service
      observability.service: commercial-service
      observability.env: prod
      observability.application: ${COMMERCIAL_SERVICE_APP_NAME}
      observability.deployment: bosspickseoul-commercial-service-prod
    build:
      context: .
      dockerfile: commercial-service.Dockerfile
    ports:
      - "${COMMERCIAL_SERVICE_PORT_PROD}:${COMMERCIAL_SERVICE_PORT}" # host:container
    environment:
      <<: *commercial_service_environment
    deploy:
      resources:
        limits:
          memory: ${COMMERCIAL_SERVICE_MEM_LIMIT_PROD:-768m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    external: true
