dependencies {
    implementation project(":core:common-core")
    implementation project(":core:persistence-core")
    implementation project(":core:redis-core")
    implementation project(":core:security-core")
    implementation project(":core:shared-commercial")

    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Spring MVC
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // MySQL JDBC
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Spring Security Resource Server (공유 링크 생성 등 인증 필요 API의 JWT 해석)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // Kafka (분석 조회 이벤트 발행/집계 — 인기 순위 파이프라인)
    implementation 'org.springframework.kafka:spring-kafka'
    // Redis (인기 순위 Sorted Set 집계 저장소)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // Resilience4j CircuitBreaker (내부 Feign 호출 장애 전파 차단)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    // Eureka Client for Service Discovery (Eureka 클라이언트)
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // Config Client
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    // SpringDoc (swagger - openapi 3.0)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    // Map Struct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    // 안전한 QueryDSL 버전 (OpenFeign 포크 사용)
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.1'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.1:jpa'
}
