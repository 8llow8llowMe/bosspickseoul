x-api-gateway-environment: &api_gateway_environment
  TIME_ZONE: ${TIME_ZONE}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_APPLICATION_NAME: ${API_GATEWAY_APP_NAME}
  API_GATEWAY_PORT: ${API_GATEWAY_PORT}
  SERVICE_DISCOVERY_HOSTNAME: ${SERVICE_DISCOVERY_HOSTNAME}
  SERVICE_DISCOVERY_PORT: ${SERVICE_DISCOVERY_PORT}
  JWT_ACCESS_KEY: ${JWT_ACCESS_KEY}
  JWT_BLACKLIST_FAIL_OPEN: ${JWT_BLACKLIST_FAIL_OPEN}
  REDIS_MODE: ${REDIS_MODE}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
  AUTH_SERVICE_APP_NAME: ${AUTH_SERVICE_APP_NAME}
  COMMERCIAL_SERVICE_APP_NAME: ${COMMERCIAL_SERVICE_APP_NAME}
  DISTRICT_SERVICE_APP_NAME: ${DISTRICT_SERVICE_APP_NAME}
  COMMUNITY_SERVICE_APP_NAME: ${COMMUNITY_SERVICE_APP_NAME}
  AI_SERVICE_APP_NAME: ${AI_SERVICE_APP_NAME}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  api-gateway-dev:
    image: bosspickseoul-api-gateway:latest
    container_name: bosspickseoul-api-gateway-dev
    labels:
      observability.project: bosspickseoul
      observability.group: cloud
      observability.service: api-gateway
      observability.env: dev
      observability.application: ${API_GATEWAY_APP_NAME}
      observability.deployment: bosspickseoul-api-gateway-dev
    build:
      context: .
      dockerfile: api-gateway.Dockerfile
    ports:
      - "${API_GATEWAY_PORT_DEV}:${API_GATEWAY_PORT}" # host:container
    environment:
      <<: *api_gateway_environment
      # dev 게이트웨이는 dev Eureka만 조회 (환경별 레지스트리 격리)
      SERVICE_DISCOVERY_HOSTNAME: bosspickseoul-service-discovery-dev
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  api-gateway-prod:
    image: bosspickseoul-api-gateway:latest
    container_name: bosspickseoul-api-gateway-prod
    labels:
      observability.project: bosspickseoul
      observability.group: cloud
      observability.service: api-gateway
      observability.env: prod
      observability.application: ${API_GATEWAY_APP_NAME}
      observability.deployment: bosspickseoul-api-gateway-prod
    build:
      context: .
      dockerfile: api-gateway.Dockerfile
    ports:
      - "${API_GATEWAY_PORT_PROD}:${API_GATEWAY_PORT}" # host:container
    environment:
      <<: *api_gateway_environment
      # prod 게이트웨이는 prod Eureka만 조회 (환경별 레지스트리 격리)
      SERVICE_DISCOVERY_HOSTNAME: bosspickseoul-service-discovery-prod
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    external: true
