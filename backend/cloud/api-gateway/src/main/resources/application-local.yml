server:
  port: 8000
  shutdown: graceful

spring:
  cloud:
    config:
      enabled: false  # 로컬에서만 Config Server 비활성화
    gateway:
      routes:
        - id: commercial-service-commercials
          uri: lb://commercial-service
          predicates:
            - Path=/api/v1/commercials/**
        - id: commercial-service-districts
          uri: lb://commercial-service
          predicates:
            - Path=/api/v1/districts/**
        - id: commercial-service-administrations
          uri: lb://commercial-service
          predicates:
            - Path=/api/v1/administrations/**
        - id: commercial-service-share-links
          uri: lb://commercial-service
          predicates:
            - Path=/api/v1/share-links/**
        - id: district-service-regions
          uri: lb://district-service
          predicates:
            - Path=/api/v1/regions/**
        - id: district-service-map
          uri: lb://district-service
          predicates:
            - Path=/api/v1/map/**
        - id: community-service
          uri: lb://community-service
          predicates:
            - Path=/api/v1/community/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai-reports/**
        # Swagger 문서용 라우트
        - id: auth-service-docs
          uri: http://localhost:8081
          predicates:
            - Path=/auth-service/**
          filters:
            - StripPrefix=1
        - id: commercial-service-docs
          uri: http://localhost:8083
          predicates:
            - Path=/commercial-service/**
          filters:
            - StripPrefix=1
        - id: district-service-docs
          uri: http://localhost:8082
          predicates:
            - Path=/district-service/**
          filters:
            - StripPrefix=1
        - id: community-service-docs
          uri: http://localhost:8086
          predicates:
            - Path=/community-service/**
          filters:
            - StripPrefix=1
        - id: ai-service-docs
          uri: http://localhost:8085
          predicates:
            - Path=/ai-service/**
          filters:
            - StripPrefix=1

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

jwt:
  access-key: ENC(YDO9DGO7lP8iCqeTNW/SXWCv0697ep+bbGvMnjoJfMDEtWy1Zq/yfZDsovoggEcmLLOtZfHSpLYoRO0YEUlrOl3CvD5KWXo55haCMx7cZMg=)
  blacklist-fail-open: false

# Redis
infra:
  redis:
    mode: standalone
    host: localhost
    port: 6379
    password:
    key-prefix: ${REDIS_KEY_PREFIX:bosspickseoul-dev}

# SpringDoc (Swagger) Aggregation
springdoc:
  swagger-ui:
    # Swagger UI 활성화 여부
    enabled: true
    # Swagger UI 접근 경로
    path: /swagger-ui.html
    # Swagger UI 구성에 대한 URL
    config-url: /v3/api-docs/swagger-config
    # 각 서비스의 OpenAPI 문서 URL 목록
    urls:
      - name: 인증/회원 서비스 API
        url: /auth-service/v3/api-docs
      - name: 상권 분석 서비스 API
        url: /commercial-service/v3/api-docs
      - name: 지역/지도 서비스 API
        url: /district-service/v3/api-docs
      - name: 커뮤니티 서비스 API
        url: /community-service/v3/api-docs
      - name: AI 리포트 서비스 API
        url: /ai-service/v3/api-docs
    operationsSorter: none # API 정렬 기준 없음
    displayRequestDuration: true # 각 API 요청의 응답시간(ms) 표시
