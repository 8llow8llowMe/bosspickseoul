server:
  port: ${API_GATEWAY_PORT}
  shutdown: graceful

spring:
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: commercial-service-commercials
          uri: lb://${COMMERCIAL_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/commercials/**
        - id: commercial-service-districts
          uri: lb://${COMMERCIAL_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/districts/**
        - id: commercial-service-administrations
          uri: lb://${COMMERCIAL_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/administrations/**
        - id: commercial-service-share-links
          uri: lb://${COMMERCIAL_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/share-links/**
        - id: commercial-service-analysis-rankings
          uri: lb://${COMMERCIAL_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/analysis-rankings/**
        - id: district-service-regions
          uri: lb://${DISTRICT_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/regions/**
        - id: district-service-map
          uri: lb://${DISTRICT_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/map/**
        - id: community-service
          uri: lb://${COMMUNITY_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/community/**
        - id: community-service-moderation
          uri: lb://${COMMUNITY_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/moderation/**
        - id: commercial-service-simulations
          uri: lb://${COMMERCIAL_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/simulations/**
        - id: commercial-service-analysis-bookmarks
          uri: lb://${COMMERCIAL_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/analysis-bookmarks/**
        - id: commercial-service-policies
          uri: lb://${COMMERCIAL_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/policies/**
        - id: ai-service
          uri: lb://${AI_SERVICE_APP_NAME}
          predicates:
            - Path=/api/v1/ai-reports/**
        - id: auth-service-docs
          uri: lb://${AUTH_SERVICE_APP_NAME}
          predicates:
            - Path=/auth-service/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: commercial-service-docs
          uri: lb://${COMMERCIAL_SERVICE_APP_NAME}
          predicates:
            - Path=/commercial-service/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: district-service-docs
          uri: lb://${DISTRICT_SERVICE_APP_NAME}
          predicates:
            - Path=/district-service/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: community-service-docs
          uri: lb://${COMMUNITY_SERVICE_APP_NAME}
          predicates:
            - Path=/community-service/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: ai-service-docs
          uri: lb://${AI_SERVICE_APP_NAME}
          predicates:
            - Path=/ai-service/v3/api-docs/**
          filters:
            - StripPrefix=1

eureka:
  client:
    serviceUrl:
      defaultZone: http://${SERVICE_DISCOVERY_HOSTNAME}:${SERVICE_DISCOVERY_PORT}/eureka/

jwt:
  access-key: ${JWT_ACCESS_KEY}
  blacklist-fail-open: ${JWT_BLACKLIST_FAIL_OPEN}

infra:
  redis:
    mode: ${REDIS_MODE}
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    key-prefix: ${REDIS_KEY_PREFIX}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: 인증/회원 서비스 API
        url: /auth-service/v3/api-docs
      - name: 상권 분석 서비스 API
        url: /commercial-service/v3/api-docs
      - name: 지역/지도 서비스 API
        url: /district-service/v3/api-docs
      - name: 커뮤니티 서비스 API
        url: /community-service/v3/api-docs
      - name: AI 리포트 서비스 API
        url: /ai-service/v3/api-docs
    operationsSorter: none
    displayRequestDuration: true
